<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <meta id="meta-desc" name="description" content="" />
</head>

<body>
  <div id="layout" style="opacity: 0; transition: opacity 0.5s ease;">
    <!-- Left Sidebar / Header (Sticky on Desktop) -->
    <aside class="sidebar">
      <!-- Theme Toggle -->


      <header class="profile-header">
        <div class="profile-intro">
          <div class="logo" id="profile-initials"></div>
          <h1 id="profile-name"></h1>
        </div>
        <p class="subtitle" id="profile-subtitle"></p>

        <nav class="social-links" id="profile-socials">
          <!-- Dynamic Social Links -->
        </nav>
      </header>

      <section class="section education-section" style="margin-bottom: 2rem;">
        <h2>Education</h2>
        <div id="education-list">
          <!-- Dynamic Education -->
        </div>
      </section>

      <section class="section skills-section">
        <h2>Skills</h2>
        <div class="skills-tags" id="skills-list">
          <!-- Dynamic Skills -->
        </div>
      </section>


    </aside>

    <main class="content">
      <!-- Theme Switch (Top Right) -->
      <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
          <input type="checkbox" id="checkbox" />
          <div class="slider round">
            <svg class="icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"
              style="position: absolute; left: 4px; top: 3px;">
              <circle cx="12" cy="12" r="5" />
              <path
                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
            </svg>
            <svg class="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"
              style="position: absolute; right: 4px; top: 3px;">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </div>
        </label>
      </div>

      <div class="summary-section" id="profile-summary"
        style="margin-bottom: 3rem; border-bottom: 1px solid var(--color-border); padding-bottom: 2rem;">
        <!-- Dynamic Summary -->
      </div>
      <section class="section experience-section">
        <h2>Experience</h2>
        <div id="experience-list">
          <!-- Dynamic Experience -->
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; <span id="year"></span> <span id="footer-name"></span></p>
    </footer>
  </div>
  <script type="module" src="/main.js"></script>
</body>

</html>

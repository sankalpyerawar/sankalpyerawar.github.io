<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <meta id="meta-desc" name="description" content="" />
</head>

<body>
  <div id="layout" style="opacity: 0; transition: opacity 0.5s ease;">
    <!-- Left Sidebar / Header (Sticky on Desktop) -->
    <aside class="sidebar">
      <!-- Theme Toggle -->


      <header class="profile-header">
        <div class="profile-intro">
          <div class="logo" id="profile-initials"></div>
          <h1 id="profile-name"></h1>
        </div>
        <p class="subtitle" id="profile-subtitle"></p>

        <div class="social-actions"
          style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;">
          <nav class="social-links" id="profile-socials">
            <!-- Dynamic Social Links -->
          </nav>

          <div class="theme-switch-wrapper">
            <label class="theme-switch" for="checkbox">
              <input type="checkbox" id="checkbox" />
              <div class="slider round">
                <svg class="icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"
                  style="position: absolute; left: 4px; top: 3px;">
                  <circle cx="12" cy="12" r="5" />
                  <path
                    d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                </svg>
                <svg class="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"
                  style="position: absolute; right: 4px; top: 3px;">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
              </div>
            </label>
          </div>
        </div>

        <div id="resume-container" style="margin-bottom: 2.5rem; margin-top: -1.5rem;">
             <!-- Dynamic Resume Button -->
        </div>
      </header>

      <section class="section education-section" style="margin-bottom: 2rem;" id="education-section">
        <h2 id="education-toggle"
          style="cursor: pointer; display: flex; align-items: center; justify-content: space-between;">
          Education
          <span class="chevron rotate-icon" style="transition: transform 0.3s ease;">▼</span>
        </h2>
        <div id="education-list" class="collapsible-content open">
          <!-- Dynamic Education -->
        </div>
      </section>

      <section class="section skills-section" id="skills-section">
        <h2 id="skills-toggle"
          style="cursor: pointer; display: flex; align-items: center; justify-content: space-between;">
          Skills
          <span class="chevron" style="transition: transform 0.3s ease;">▼</span>
        </h2>
        <div class="skills-tags collapsible-content" id="skills-list">
          <!-- Dynamic Skills -->
        </div>
      </section>


    </aside>

    <main class="content">
      <!-- Theme Switch (Top Right) -->


      <div class="summary-section" style="margin-bottom: 3rem;">
        <h2 id="summary-toggle"
          style="cursor: pointer; display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
          Summary
          <span class="chevron rotate-icon" style="transition: transform 0.3s ease;">▼</span>
        </h2>
        <div id="profile-summary" class="collapsible-content open">
          <!-- Dynamic Summary -->
        </div>
      </div>

      <section class="section projects-section" style="margin-bottom: 3rem;" id="projects-section">
        <h2 id="projects-toggle"
          style="cursor: pointer; display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
          Projects
          <span class="chevron rotate-icon" style="transition: transform 0.3s ease;">▼</span>
        </h2>
        <div id="projects-list" class="collapsible-content open">
          <!-- Dynamic Projects -->
        </div>
      </section>

      <section class="section experience-section">
        <h2 id="experience-toggle"
          style="cursor: pointer; display: flex; align-items: center; justify-content: space-between;">
          Experience
          <span class="chevron" style="transition: transform 0.3s ease;">▼</span>
        </h2>
        <div id="experience-list" class="collapsible-content">
          <!-- Dynamic Experience -->
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; <span id="year"></span> <span id="footer-name"></span></p>
    </footer>
  </div>
  <script type="module" src="/main.js"></script>
</body>

</html>

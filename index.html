<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <meta id="meta-desc" name="description" content="" />
</head>

<body>
  <div id="layout" style="opacity: 0; transition: opacity 0.5s ease;">
    <!-- Left Sidebar (Fixed) -->
    <aside class="sidebar">

      <header class="profile-header">
        <div class="profile-intro">
          <div class="logo" id="profile-initials"></div>
          <h1 id="profile-name"></h1>
        </div>
        <p class="subtitle" id="profile-subtitle"></p>

        <div class="social-actions">
          <nav class="social-links" id="profile-socials">
            <!-- Dynamic Social Links -->
          </nav>
        </div>

        <div id="resume-container">
             <!-- Dynamic Resume Button -->
        </div>
      </header>

      <!-- Navigation Menu -->
      <nav class="main-nav">
        <ul>
          <li><a href="#summary-section">SUMMARY</a></li>
          <li><a href="#experience-section">EXPERIENCE</a></li>
          <li><a href="#skills-section">SKILLS</a></li>
          <li><a href="#projects-section">PROJECTS</a></li>
          <li><a href="#game-container">GAME</a></li>
        </ul>
      </nav>

      <!-- System Status Widget -->
      <div class="system-status-widget">
        <div id="sys-time">--:--:--</div>
        <div class="status-learning">
          <span class="status-label">CURRENTLY LEARNING:</span>
          <span class="status-value">AI-Assisted Development</span>
        </div>
      </div>

      <!-- Terminal Prompt -->
      <div class="terminal-widget">
        <div id="terminal-output"></div>
        <div class="input-line">
          <span class="prompt-char">&gt;_</span>
          <input type="text" id="terminal-input" placeholder="type 'help'" autocomplete="off">
        </div>
      </div>

      <!-- Hidden Theme Toggle to preserve JS compatibility if needed, or we can remove usage in main.js later -->
      <button id="theme-toggle" style="display: none;"></button>

    </aside>

    <!-- Main Content (Scrollable) -->
    <main class="content">

      <!-- Game Container -->
      <section id="game-wrapper">
        <div id="game-container">
          <canvas id="game-canvas"></canvas>
          <div id="game-overlay">
            <div class="game-title">CODE QUEST: ESCAPE THE VOID</div>
            <div class="game-start-msg">PRESS SPACE OR TAP TO START</div>
          </div>
        </div>
      </section>

      <!-- Summary -->
      <div class="section summary-section" id="summary-section">
        <h2 id="summary-toggle">SUMMARY</h2>
        <div id="profile-summary" class="collapsible-content open">
          <!-- Dynamic Summary -->
        </div>
      </div>

      <!-- Experience -->
      <section class="section experience-section" id="experience-section">
        <h2 id="experience-toggle">EXPERIENCE</h2>
        <div id="experience-list" class="collapsible-content open">
          <!-- Dynamic Experience -->
        </div>
      </section>

      <!-- Skills (Moved to Main) -->
      <section class="section skills-section" id="skills-section">
        <h2 id="skills-toggle">SKILLS</h2>
        <div class="skills-tags collapsible-content open" id="skills-list">
          <!-- Dynamic Skills -->
        </div>
      </section>

      <!-- Projects -->
      <section class="section projects-section" id="projects-section">
        <h2 id="projects-toggle">PROJECTS</h2>
        <div id="projects-list" class="collapsible-content open">
          <!-- Dynamic Projects -->
        </div>
      </section>

      <!-- Education (Moved to Main, after Projects) -->
       <section class="section education-section" id="education-section">
        <h2 id="education-toggle">EDUCATION</h2>
        <div id="education-list" class="collapsible-content open">
          <!-- Dynamic Education -->
        </div>
      </section>

      <footer class="footer">
        <p>&copy; <span id="year"></span> <span id="footer-name"></span></p>
      </footer>
    </main>
  </div>
  <script type="module" src="/main.js"></script>
</body>

</html>
